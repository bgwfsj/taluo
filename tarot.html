<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>塔罗之语</title>
<style>
/* ===== 基础 ===== */
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --ink: #2b2b33;
  --ink-2: #6d6d78;
  --ink-3: #a0a0ab;
  --line: #ecebe6;
  --accent: #7c6ce0;
  --accent-soft: #efecfb;
  --accent-deep: #5f4ecb;
  --gold: #c9a86a;
  --upright: #7c6ce0;
  --reversed: #d98a76;
  --ok: #4caf7d;
  --danger: #d96a5f;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 10px 30px rgba(43, 43, 51, .08);
  --shadow-sm: 0 4px 14px rgba(43, 43, 51, .06);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; padding: 0; }
input, textarea { font-family: inherit; font-size: 1rem; color: var(--ink); }
h1, h2, h3, h4, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
a { color: var(--accent); text-decoration: none; }
::-webkit-scrollbar { width: 0; height: 0; }
:focus { outline: none; }

.hidden { display: none !important; }
.muted { color: var(--ink-3); }
.small { font-size: .82rem; }

/* 通用按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 22px; border-radius: 999px; font-size: .95rem; font-weight: 600;
  transition: transform .15s ease, opacity .15s ease, background .15s ease;
  user-select: none;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(124,108,224,.32); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn-block { width: 100%; }
.btn-mini { padding: 8px 16px; font-size: .82rem; font-weight: 500; }

/* ===== 布局 ===== */
#app { max-width: 520px; margin: 0 auto; padding: 0 16px calc(88px + var(--safe-b)); min-height: 100vh; }

.app-header {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  padding: calc(var(--safe-t) + 12px) 0 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.app-header .brand { font-size: 1.05rem; font-weight: 700; letter-spacing: .04em; }
.app-header .brand .dot { color: var(--gold); }
.app-header .date { font-size: .82rem; color: var(--ink-3); }

.view { display: none; padding-top: 6px; }
.view.active { display: block; animation: fadeUp .28s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* 底部导航 */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; justify-content: space-around; align-items: stretch;
  background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b);
  max-width: 520px; margin: 0 auto;
}
.tabbar button {
  flex: 1; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: .72rem; color: var(--ink-3); transition: color .15s ease;
}
.tabbar button .ico { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.tabbar button svg { width: 22px; height: 22px; stroke: currentColor; }
.tabbar button.active { color: var(--accent); font-weight: 600; }

/* 页面头（二级页） */
.page-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0 14px;
}
.page-head .back {
  width: 38px; height: 38px; border-radius: 50%; background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm); color: var(--ink);
}
.page-head .back svg { width: 20px; height: 20px; stroke: currentColor; }
.page-head h1 { font-size: 1.1rem; font-weight: 700; flex: 1; }

/* ===== 塔罗牌 ===== */
.tarot-card {
  position: relative; width: 100%; aspect-ratio: 3 / 5;
  perspective: 1200px; user-select: none; -webkit-user-select: none;
}
.tarot-card .face {
  position: absolute; inset: 0; border-radius: 16px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transition: transform .7s cubic-bezier(.4, 1.1, .4, 1);
  overflow: hidden;
}
.tarot-card .face.back { transform: rotateY(180deg); }
.tarot-card.flipped .face.front { transform: rotateY(180deg); }
.tarot-card.flipped .face.back { transform: rotateY(360deg); }
.tarot-card.shake { animation: shake .5s ease; }
@keyframes shake { 0%,100%{transform:none} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }

/* 牌背 */
.card-back {
  background: linear-gradient(145deg, #3a3555 0%, #241f3d 100%);
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(201,168,106,.35);
}
.card-back::before {
  content: ""; position: absolute; inset: 10px; border: 1px solid rgba(201,168,106,.5); border-radius: 12px;
}
.card-back .emblem { color: var(--gold); font-size: 2rem; opacity: .95; }
.card-back .glint {
  position: absolute; width: 40px; height: 40px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.18), transparent 65%);
  top: 20%; left: 12%;
}

/* 牌面（正面） */
.card-front {
  background: linear-gradient(170deg, #fdfdfb 0%, #f3f1ec 100%);
  border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 10px;
}
.card-front .corner {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  font-size: .78rem; font-weight: 700; color: var(--ink-2);
}
.card-front .corner .num { font-family: Georgia, serif; font-size: .9rem; }
.card-front .art {
  flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  margin: 4px 0;
}
.card-front .art .glyph { font-size: 3.2rem; line-height: 1; }
.card-front .art .suit { width: 64%; height: auto; }
.card-front .art .rank-txt { font-family: Georgia, serif; font-size: 1.35rem; font-weight: 700; color: var(--ink); letter-spacing: .06em; }
.card-front .card-name { font-size: .78rem; font-weight: 600; color: var(--ink); letter-spacing: .1em; text-align: center; }
.card-front .card-name-en { font-size: .6rem; color: var(--ink-3); letter-spacing: .04em; margin-top: 1px; }

/* 迷你牌 */
.mini-card {
  position: relative; width: 54px; height: 90px; flex: none;
  border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-sm);
  background: linear-gradient(170deg, #fdfdfb, #f3f1ec);
  border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 4px;
}
.mini-card .glyph { font-size: 1.5rem; line-height: 1; }
.mini-card .suit { width: 46%; height: auto; }
.mini-card .mini-num { font-family: Georgia, serif; font-size: .7rem; font-weight: 700; }
.mini-card.back { background: linear-gradient(145deg, #3a3555, #241f3d); border-color: rgba(201,168,106,.4); }
.mini-card.back .glyph { color: var(--gold); }

/* 标签 / 关键词 */
.chip {
  display: inline-flex; align-items: center; padding: 5px 12px;
  background: var(--accent-soft); color: var(--accent-deep);
  border-radius: 999px; font-size: .8rem; font-weight: 500;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* 六维解读 */
.dim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dim-item {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 14px; cursor: pointer; transition: border-color .15s ease;
}
.dim-item:active { border-color: var(--accent); }
.dim-item .dim-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .92rem; }
.dim-item .dim-head .em { font-size: 1.1rem; }
.dim-item .dim-body {
  display: none; margin-top: 8px; font-size: .86rem; color: var(--ink-2); line-height: 1.55;
}
.dim-item.open .dim-body { display: block; }
.dim-item.open .dim-head::after { content: "▾"; margin-left: auto; color: var(--ink-3); }
.dim-item .dim-head::after { content: "▸"; margin-left: auto; color: var(--ink-3); }

/* 卡片容器 */
.panel {
  background: var(--surface); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--line);
}
.panel + .panel { margin-top: 14px; }
.panel-title { font-size: .95rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(100px + var(--safe-b)); transform: translateX(-50%) translateY(20px);
  background: rgba(43,43,51,.92); color: #fff; font-size: .86rem;
  padding: 10px 18px; border-radius: 999px; z-index: 100;
  opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
  max-width: 80%; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Modal */
.modal-mask {
  position: fixed; inset: 0; background: rgba(30,28,45,.42); z-index: 90;
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.modal {
  background: var(--surface); width: 100%; max-width: 520px;
  border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + var(--safe-b));
  animation: slideUp .28s cubic-bezier(.3, .9, .3, 1);
}
@keyframes slideUp { from { transform: translateY(40px); opacity: .6 } to { transform: none; opacity: 1 } }
.modal h3 { font-size: 1rem; margin-bottom: 12px; }

/* 表单 */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: .84rem; color: var(--ink-2); margin-bottom: 6px; }
textarea, input[type="text"] {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 12px; background: var(--bg); resize: vertical;
}
textarea:focus, input:focus { border-color: var(--accent); background: #fff; }
.char-count { text-align: right; font-size: .72rem; color: var(--ink-3); margin-top: 4px; }

/* 进度条 */
.progress { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), #a98de0); transition: width .4s ease; }

/* 备注 */
.note-item {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 10px; background: var(--bg);
}
.note-item .note-text { font-size: .88rem; white-space: pre-wrap; word-break: break-word; }
.note-item .note-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 8px; font-size: .72rem; color: var(--ink-3);
}
.note-item .note-actions { display: flex; gap: 14px; }
.note-item .note-actions button { color: var(--ink-3); font-size: .78rem; }
.note-item .note-actions button:hover { color: var(--accent); }

/* 分组列表 */
.group { margin-bottom: 18px; }
.group-title {
  position: sticky; top: 58px; z-index: 10;
  font-size: .82rem; font-weight: 700; color: var(--ink-2);
  background: var(--bg); padding: 8px 2px 6px;
}
.group-title .count { color: var(--ink-3); font-weight: 400; margin-left: 4px; }
.card-row {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 14px; margin-bottom: 10px; cursor: pointer;
  transition: border-color .15s ease;
}
.card-row:active { border-color: var(--accent); }
.card-row .row-info { flex: 1; min-width: 0; }
.card-row .row-name { font-weight: 600; font-size: .95rem; }
.card-row .row-en { font-size: .72rem; color: var(--ink-3); }
.card-row .row-kw {
  font-size: .76rem; color: var(--ink-2); margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.learned-badge {
  color: var(--gold); flex: none; font-size: 1rem;
}
.learned-badge::before { content: "☆"; }
.learned-badge.done::before { content: "★"; color: var(--gold); }

/* 搜索结果空态 */
.empty-tip { text-align: center; color: var(--ink-3); padding: 40px 0; font-size: .88rem; }

/* 逆位视觉（内容旋转 180°） */
.card-front.rev { transform: rotate(180deg); }
.mini-card.rev .mini-num, .mini-card.rev .glyph, .mini-card.rev .suit { transform: rotate(180deg); }

/* ===== 今日 ===== */
.hero { text-align: center; padding: 18px 0 8px; }
.hero h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: .06em; }
.hero .sub { color: var(--ink-3); font-size: .86rem; margin-top: 4px; }
.draw-zone { display: flex; flex-direction: column; align-items: center; padding: 22px 0 6px; }
.draw-card-wrap { width: 210px; margin: 0 auto; }
.draw-hint {
  margin-top: 18px; font-size: .86rem; color: var(--ink-2);
  display: flex; align-items: center; gap: 8px;
}
.draw-hint .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1.6s ease infinite; }
@keyframes pulse { 0%,100%{ opacity: 1; transform: scale(1) } 50%{ opacity: .4; transform: scale(.7) } }

/* 抽牌结果 */
.result-block { margin-top: 8px; }
.orientation-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 999px; font-size: .82rem; font-weight: 600; color: #fff;
}
.orientation-badge.upright { background: var(--upright); }
.orientation-badge.reversed { background: var(--reversed); }
.result-title { text-align: center; margin: 10px 0 4px; }
.result-title .cn { font-size: 1.3rem; font-weight: 700; }
.result-title .en { font-size: .8rem; color: var(--ink-3); letter-spacing: .05em; }
.summary-text { font-size: .92rem; color: var(--ink-2); text-align: center; padding: 0 6px; }
.section-title {
  font-size: .9rem; font-weight: 700; margin: 18px 0 10px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--gold); }
.re-draw { margin-top: 20px; text-align: center; }
.re-draw button { color: var(--ink-3); font-size: .8rem; text-decoration: underline; }

/* ===== 图鉴 ===== */
.search-box { position: relative; margin: 4px 0 12px; }
.search-box input { padding-left: 38px; }
.search-box .mag { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: .95rem; }

/* ===== 牌义详情 ===== */
.detail-card-wrap { width: 190px; margin: 4px auto 18px; }
.detail-orientations { margin-top: 4px; }
.orient-block { margin-bottom: 14px; }
.orient-block .orient-head {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 700; font-size: .95rem;
}
.orient-block .orient-head .dot { width: 8px; height: 8px; border-radius: 50%; }
.orient-block .orient-head .dot.upright { background: var(--upright); }
.orient-block .orient-head .dot.reversed { background: var(--reversed); }
.orient-block .orient-summary { font-size: .88rem; color: var(--ink-2); margin-bottom: 8px; }
.learn-toggle {
  display: flex; align-items: center; gap: 8px; width: 100%;
  justify-content: center; padding: 12px; border-radius: var(--radius-sm);
  border: 1px dashed var(--gold); color: var(--ink-2); font-size: .9rem; font-weight: 600;
}
.learn-toggle.done { background: #fbf7ee; border-style: solid; color: #9a7a3f; }

/* ===== 我的 ===== */
.me-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 14px 0; border-bottom: 1px solid var(--line);
  font-size: .92rem; color: var(--ink);
}
.me-row:last-child { border-bottom: none; }
.me-row .ico { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex: none; }
.me-row .txt { flex: 1; text-align: left; }
.me-row .sub { display: block; font-size: .76rem; color: var(--ink-3); margin-top: 1px; }
.me-row .arrow { color: var(--ink-3); }
.version-line { text-align: center; color: var(--ink-3); font-size: .76rem; margin-top: 22px; }

</style>
</head>
<body>
<div id="app">
  <header id="app-header" class="app-header"></header>
  <main id="view-home" class="view"></main>
  <main id="view-glossary" class="view"></main>
  <main id="view-detail" class="view"></main>
  <main id="view-me" class="view"></main>
</div>
<nav id="tabbar" class="tabbar" aria-label="主导航"></nav>
<div id="toast" class="toast" role="status"></div>
<div id="modal-root"></div>
<script>
// ===== 常量 =====
const APP_INFO = {
  name: '塔罗之语',
  version: '0.1.0',
  changelog: [
    { v: '0.1.0', date: '2026-11-18', items: ['初版：今日之牌每日一抽', '78 张牌正逆位含义图鉴', '已学习标记与无限条备注（每条 500 字）'] }
  ]
};

const DIMENSIONS = [
  { key: 'career', label: '事业学业', em: '💼' },
  { key: 'love', label: '感情', em: '💗' },
  { key: 'wealth', label: '财运', em: '🪙' },
  { key: 'health', label: '健康', em: '🌿' },
  { key: 'social', label: '人际', em: '🤝' },
  { key: 'spirit', label: '心灵成长', em: '✨' }
];

const SUITS = {
  wands:     { label: '权杖', en: 'Wands',     em: '🪄', color: '#e08a3c', element: '火 · 行动与热情' },
  cups:      { label: '圣杯', en: 'Cups',      em: '🍷', color: '#4a8fd8', element: '水 · 情感与直觉' },
  swords:    { label: '宝剑', en: 'Swords',    em: '⚔️', color: '#7f8a9e', element: '风 · 思维与沟通' },
  pentacles: { label: '星币', en: 'Pentacles', em: '🪙', color: '#5f9e6f', element: '土 · 物质与务实' }
};

const STORE_KEYS = {
  notes: 'tarot.notes',
  learned: 'tarot.learned',
  today: 'tarot.today'
};

const NOTE_LIMIT = 500;

const GROUPS = [
  { key: 'major', label: '大阿卡纳' },
  { key: 'wands', label: '权杖 · 火' },
  { key: 'cups', label: '圣杯 · 水' },
  { key: 'swords', label: '宝剑 · 风' },
  { key: 'pentacles', label: '星币 · 土' }
];

// ===== 本地存储 =====
function storeGet(key, def) {
  try {
    const raw = localStorage.getItem(key);
    return raw == null ? def : JSON.parse(raw);
  } catch (e) { return def; }
}
function storeSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch (e) { console.warn('storeSet failed', key, e); }
}

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

const NotesStore = {
  all() { return storeGet(STORE_KEYS.notes, {}); },
  forCard(id) {
    const arr = storeGet(STORE_KEYS.notes, {})[id] || [];
    return arr.slice().sort((a, b) => b.ts - a.ts);
  },
  add(id, text) {
    const all = storeGet(STORE_KEYS.notes, {});
    (all[id] = all[id] || []).push({ text: text.trim(), ts: Date.now() });
    storeSet(STORE_KEYS.notes, all);
  },
  update(id, ts, text) {
    const all = storeGet(STORE_KEYS.notes, {});
    const arr = all[id] || [];
    const item = arr.find(x => x.ts === ts);
    if (item) item.text = text.trim();
    storeSet(STORE_KEYS.notes, all);
  },
  remove(id, ts) {
    const all = storeGet(STORE_KEYS.notes, {});
    all[id] = (all[id] || []).filter(x => x.ts !== ts);
    if (!all[id].length) delete all[id];
    storeSet(STORE_KEYS.notes, all);
  }
};

const LearnedStore = {
  all() { return storeGet(STORE_KEYS.learned, []); },
  has(id) { return storeGet(STORE_KEYS.learned, []).includes(id); },
  toggle(id) {
    const arr = storeGet(STORE_KEYS.learned, []);
    const idx = arr.indexOf(id);
    if (idx >= 0) arr.splice(idx, 1); else arr.push(id);
    storeSet(STORE_KEYS.learned, arr);
    return idx < 0;
  },
  count() { return storeGet(STORE_KEYS.learned, []).length; },
  list() { return storeGet(STORE_KEYS.learned, []); }
};

const TodayStore = {
  get() { return storeGet(STORE_KEYS.today, null); },
  isToday() {
    const t = storeGet(STORE_KEYS.today, null);
    return !!t && t.date === todayKey();
  },
  set(cardId, orientation) { storeSet(STORE_KEYS.today, { date: todayKey(), cardId, orientation }); },
  clear() { localStorage.removeItem(STORE_KEYS.today); }
};

// ===== UI 基础组件 =====
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
}

function openModal(title, bodyHTML, actions) {
  const root = document.getElementById('modal-root');
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true">' +
    '<h3>' + title + '</h3>' + bodyHTML +
    '<div class="modal-actions" style="display:flex;gap:10px;margin-top:16px;">' + (actions || '') + '</div>' +
    '</div>';
  root.appendChild(mask);
  mask.addEventListener('click', function (e) {
    if (e.target === mask) closeModal();
  });
  return function close() { closeModal(); };
}
function closeModal() {
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
}
function modalBtn(label, cls, handler) {
  const b = document.createElement('button');
  b.className = 'btn ' + (cls || 'btn-primary');
  b.style.flex = '1';
  b.textContent = label;
  b.addEventListener('click', handler);
  return b;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtDate(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

// ===== 轻量路由 =====
const Router = {
  current: 'home',
  param: null,
  stack: [],
  tabs: ['home', 'glossary', 'me'],
  go(name, param) {
    this.current = name;
    this.param = param || null;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    const el = document.getElementById('view-' + name);
    if (el) el.classList.add('active');
    const header = document.getElementById('app-header');
    if (name === 'detail') header.classList.add('hidden');
    else header.classList.remove('hidden');
    this.syncTabbar();
    window.scrollTo(0, 0);
  },
  push(name, param) {
    this.stack.push({ name: this.current, param: this.param });
    this.go(name, param);
  },
  back() {
    if (!this.stack.length) { renderHome(); this.go('home'); return; }
    const prev = this.stack.pop();
    if (prev.name === 'glossary') renderGlossary();
    else if (prev.name === 'me') renderMe();
    else if (prev.name === 'home') renderHome();
    this.go(prev.name, prev.param);
  },
  syncTabbar() {
    const tabs = document.querySelectorAll('#tabbar button');
    tabs.forEach(t => t.classList.toggle('active', t.dataset.view === this.current));
  }
};

function tabbarHTML() {

  ).join('');
}

function filterCards(cards) {
  const kw = glossaryKeyword.toLowerCase();
  if (!kw) return cards;
  return cards.filter(function (c) {
    return (c.name + ' ' + c.nameEn + ' ' + c.upright.keywords.join(' ') + ' ' + c.reversed.keywords.join(' ')).toLowerCase().indexOf(kw) >= 0;
  });
}

function renderGlossaryGroups() {
  const wrap = document.getElementById('glossary-groups');
  const empty = document.getElementById('glossary-empty');
  if (!wrap) return;
  let html = '';
  let total = 0;
  GROUPS.forEach(function (g) {
    const cards = filterCards(cardsByGroup(g.key));
    total += cards.length;
    if (!cards.length) return;
    html +=
      '<div class="group"><div class="group-title">' + g.label + '<span class="count">' + cards.length + '</span></div>' +
      cards.map(cardRowHTML).join('') + '</div>';
  });
  wrap.innerHTML = html;
  empty.classList.toggle('hidden', total > 0);
  wrap.querySelectorAll('.card-row').forEach(function (row) {
    row.addEventListener('click', function () { Router.push('detail', row.dataset.id); });
  });

function notesFormHTML(cardId) {

  );

function bindNotes(cardId) {
  const input = document.getElementById('note-input');
  const count = document.getElementById('note-count');
  const addBtn = document.getElementById('note-add');
  if (!input) return;
  const syncCount = function () { count.textContent = String(input.value.length); };
  input.addEventListener('input', syncCount);
  addBtn.addEventListener('click', function () {
    const text = input.value.trim();
    if (!text) { toast('备注内容不能为空'); return; }
    if (text.length > NOTE_LIMIT) { toast('每条备注最多 ' + NOTE_LIMIT + ' 字'); return; }
    NotesStore.add(cardId, text);
    input.value = '';
    syncCount();
    renderNotes(cardId);
    toast('备注已添加');
  });
  renderNotes(cardId);
}

function renderNotes(cardId) {
  const list = document.getElementById('notes-list');
  if (!list) return;
  const notes = NotesStore.forCard(cardId);
  if (!notes.length) {
    list.innerHTML = '<p class="muted small" style="padding:6px 0;">还没有备注，从第一条开始吧。</p>';
    return;
  }
  list.innerHTML = notes.map(function (n) {
    return (
      '<div class="note-item" data-ts="' + n.ts + '">' +
        '<div class="note-text">' + esc(n.text) + '</div>' +
        '<div class="note-meta"><span>' + fmtDate(n.ts) + '</span>' +
          '<span class="note-actions"><button class="note-edit">编辑</button><button class="note-del">删除</button></span>' +
        '</div>' +
      '</div>'
    );
  }).join('');
  list.querySelectorAll('.note-edit').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const ts = Number(btn.closest('.note-item').dataset.ts);
      editNote(cardId, ts);
    });
  });
  list.querySelectorAll('.note-del').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const ts = Number(btn.closest('.note-item').dataset.ts);
      const close = openModal('删除这条备注？', '<p style="color:var(--ink-2);font-size:.9rem;">删除后不可恢复。</p>',
        modalBtn('取消', 'btn-ghost', closeModal).outerHTML +
        modalBtn('删除', 'btn-primary', function () {
          closeModal();
          NotesStore.remove(cardId, ts);
          renderNotes(cardId);
          toast('备注已删除');
        }).outerHTML);
    });
  });
}

function editNote(cardId, ts) {
  const note = NotesStore.forCard(cardId).find(function (n) { return n.ts === ts; });
  if (!note) return;
  const close = openModal('编辑备注',
    '<textarea id="edit-note-input" maxlength="' + NOTE_LIMIT + '" style="min-height:90px;">' + esc(note.text) + '</textarea>' +
    '<div class="char-count"><span id="edit-note-count">' + note.text.length + '</span> / ' + NOTE_LIMIT + '</div>',
    modalBtn('取消', 'btn-ghost', closeModal).outerHTML +
    modalBtn('保存', 'btn-primary', function () {
      const input = document.getElementById('edit-note-input');
      const text = input.value.trim();
      if (!text) { toast('备注内容不能为空'); return; }
      if (text.length > NOTE_LIMIT) { toast('每条备注最多 ' + NOTE_LIMIT + ' 字'); return; }
      NotesStore.update(cardId, ts, text);
      closeModal();
      renderNotes(cardId);
      toast('备注已更新');
    }).outerHTML);
  const input = document.getElementById('edit-note-input');
  const count = document.getElementById('edit-note-count');
  input.addEventListener('input', function () { count.textContent = String(input.value.length); });
  input.focus();
}

  }).join('');

  view.querySelector('#me-export').addEventListener('click', exportBackup);
  // 导入
  view.querySelector('#me-import').addEventListener('click', function () {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.addEventListener('change', function () {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () { importBackup(String(reader.result)); };
      reader.readAsText(file, 'utf-8');
    });
    input.click();
  });
  // 重置
  view.querySelector('#me-reset').addEventListener('click', function () {
    const close = openModal('重置全部数据？', '<p style="color:var(--ink-2);font-size:.9rem;">将清空所有备注、学习标记和今日之牌，且不可恢复。建议先导出备份。</p>',
      modalBtn('取消', 'btn-ghost', closeModal).outerHTML +
      modalBtn('确认重置', 'btn-primary', function () {
        closeModal();
        Object.keys(STORE_KEYS).forEach(function (k) { localStorage.removeItem(STORE_KEYS[k]); });
        renderMe();
        toast('已重置全部数据');
      }).outerHTML);
  });
}

function exportBackup() {
  const data = {
    app: APP_INFO.name,
    version: APP_INFO.version,
    exportedAt: new Date().toISOString(),
    notes: storeGet(STORE_KEYS.notes, {}),
    learned: storeGet(STORE_KEYS.learned, []),
    today: storeGet(STORE_KEYS.today, null)
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = '塔罗备份-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  toast('备份已导出');
}

function importBackup(text) {
  try {
    const data = JSON.parse(text);
    if (!data || typeof data !== 'object' || !('notes' in data) || !('learned' in data)) {
      toast('不是有效的备份文件');
      return;
    }
    storeSet(STORE_KEYS.notes, data.notes || {});
    storeSet(STORE_KEYS.learned, Array.isArray(data.learned) ? data.learned : []);
    if (data.today && typeof data.today === 'object') storeSet(STORE_KEYS.today, data.today);
    renderMe();
    toast('备份已导入 ✓');
  } catch (e) {
    toast('备份文件解析失败');
  }
}

// 返回 { career, love, wealth, health, social, spirit }
function todayReadingFor(card, orientation) {
  const o = orientation === 'reversed' ? 'r' : 'u';
  if (card.arcana === 'major') {
    const today = card[orientation].today || {};
    const out = {};
    for (const dim of DIMENSIONS) out[dim.key] = today[dim.key] || '';
    return out;
  }
  const suit = SUIT_DIM_TODAY[card.suit];
  const rank = RANK_TODAY[card.rank] || RANK_TODAY.ace;
  const out = {};
  for (const dim of DIMENSIONS) out[dim.key] = suit[dim.key][o] + ' ' + rank[o];
  return out;
}

  { id: 'p-knight', suit: 'pentacles', rank: 'knight', name: '星币骑士', nameEn: 'Knight of Pentacles',
    upright: { summary: '可靠、耐心、稳步前进。慢而稳，终会抵达。', keywords: ['可靠', '耐心', '稳步', '勤恳'] },
    reversed: { summary: '停滞、固执、僵化。稳是优点，僵是陷阱。', keywords: ['停滞', '固执', '僵化'] },
    desc: '骑士稳稳骑在马上，手持星币，背景是耕地。象征稳扎稳打、可靠的推进。' },
  { id: 'p-queen', suit: 'pentacles', rank: 'queen', name: '星币皇后', nameEn: 'Queen of Pentacles',
    upright: { summary: '滋养、务实、丰盛。把日子过得踏实又温暖。', keywords: ['滋养', '务实', '丰盛', '照顾'] },
    reversed: { summary: '过度操劳、自我忽视、焦虑。照顾好自己，才有余力照顾别人。', keywords: ['过度操劳', '自我忽视', '焦虑'] },
    desc: '皇后端坐于繁花宝座，手托星币，脚边有兔子。象征务实的滋养与丰盛的生活。' },
  { id: 'p-king', suit: 'pentacles', rank: 'king', name: '星币国王', nameEn: 'King of Pentacles',
    upright: { summary: '稳健、富足、经营有道。把资源经营成持续的底气。', keywords: ['稳健', '富足', '经营', '可靠'] },
    reversed: { summary: '贪婪、物质主义、守财。金钱是工具，不是目的。', keywords: ['贪婪', '物质主义', '守财'] },
    desc: '国王身着华服端坐于葡萄藤宝座，手持权杖与星币。象征富足、稳健与经营的智慧。' }
];

// ===== 塔罗数据聚合与牌面渲染 =====
const MAJOR_CARDS = [...MAJOR_CARDS_A, ...MAJOR_CARDS_B];
const MINOR_CARDS = [...MINOR_CARDS_WANDS, ...MINOR_CARDS_CUPS, ...MINOR_CARDS_SWORDS, ...MINOR_CARDS_PENTACLES];
const TAROT_CARDS = [...MAJOR_CARDS, ...MINOR_CARDS];

const CARD_MAP = new Map(TAROT_CARDS.map(c => [c.id, c]));
function getCard(id) { return CARD_MAP.get(id) || null; }
function randomCard() { return TAROT_CARDS[Math.floor(Math.random() * TAROT_CARDS.length)]; }
function cardsByGroup(groupKey) {
  if (groupKey === 'major') return MAJOR_CARDS;
  return MINOR_CARDS.filter(c => c.suit === groupKey);
}

const RANK_CN = { ace: '一', two: '二', three: '三', four: '四', five: '五', six: '六', seven: '七', eight: '八', nine: '九', ten: '十', page: '侍从', knight: '骑士', queen: '皇后', king: '国王' };
const RANK_NUM = { ace: 'A', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9', ten: '10', page: 'P', knight: 'KN', queen: 'Q', king: 'K' };
const MAJOR_ROMAN = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];

function cornerNum(card) {
  if (card.arcana === 'major') return MAJOR_ROMAN[card.number];
  return RANK_NUM[card.rank] || card.number;
}

// 四花色线性 SVG 符号
function suitSVG(suit, cls) {
  const color = SUITS[suit].color;
  const stroke = 'stroke="' + color + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  let inner = '';
  if (suit === 'wands') {
    inner = '<line x1="12" y1="3" x2="12" y2="21" ' + stroke + '/>' +
            '<path d="M12 3c2.2 2.1 3.4 3.9 3.4 5.7A3.4 3.4 0 0 1 12 12.1 3.4 3.4 0 0 1 8.6 8.7C8.6 6.9 9.8 5.1 12 3z" fill="' + color + '" opacity=".85"/>';
  } else if (suit === 'cups') {
    inner = '<path d="M8.5 4h7l-1 6.2a2.5 2.5 0 0 1-5 0L8.5 4z" ' + stroke + '/>' +
            '<line x1="12" y1="12.5" x2="12" y2="17" ' + stroke + '/>' +
            '<path d="M8.5 17h7" ' + stroke + '/>';
  } else if (suit === 'swords') {
    inner = '<path d="M12 2.5 8.8 9.2 12 11l3.2-1.8z" fill="' + color + '" opacity=".9"/>' +
            '<line x1="7.4" y1="11" x2="16.6" y2="11" ' + stroke + '/>' +
            '<line x1="12" y1="11" x2="12" y2="18.5" ' + stroke + '/>' +
            '<circle cx="12" cy="20" r="1.6" ' + stroke + '/>';
  } else { // pentacles
    inner = '<circle cx="12" cy="12" r="7.6" ' + stroke + '/>' +
            '<path d="M12 6.9 14.9 16.2 7.1 10.7h9.8l-7.8 5.5z" fill="' + color + '" opacity=".9"/>';
  }
  return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + inner + '</svg>';
}

function cardFrontHTML(card, opts) {
  opts = opts || {};
  const rev = opts.reversed ? ' rev' : '';
  const num = cornerNum(card);
  let art = '';
  if (card.arcana === 'major') {
    art = '<span class="glyph">' + card.glyph + '</span>';
  } else {
    const suitColor = SUITS[card.suit].color;
    art = suitSVG(card.suit, 'suit') +
          '<span class="rank-txt" style="color:' + suitColor + '">' + RANK_CN[card.rank] + '</span>';
  }
  return '<div class="card-front' + rev + '">' +
    '<div class="corner"><span class="num">' + num + '</span><span class="num">' + num + '</span></div>' +
    '<div class="art">' + art + '</div>' +
    '<div><div class="card-name">' + card.name + '</div><div class="card-name-en">' + card.nameEn + '</div></div>' +
    '</div>';
}

function cardBackHTML() {
  return '<div class="face back"><div class="card-back"><span class="glint"></span><span class="emblem">✦</span></div></div>';
}

// 完整可翻转的塔罗牌
function tarotCardHTML(card, opts) {
  opts = opts || {};
  const flipClass = opts.flipped ? ' flipped' : '';
  const front = card ? cardFrontHTML(card, opts) : '<div class="card-front"></div>';
  const wrapper = '<div class="tarot-card' + flipClass + (opts.shake ? ' shake' : '') + '"' + (opts.id ? ' id="' + opts.id + '"' : '') + '>' +
    '<div class="face front">' + front + '</div>' +
    cardBackHTML() + '</div>';
  return wrapper;
}

// 图鉴用的迷你牌
function miniCardHTML(card) {
  if (card.arcana === 'major') {
    return '<div class="mini-card"><span class="glyph">' + card.glyph + '</span><span class="mini-num">' + cornerNum(card) + '</span></div>';
  }
  return '<div class="mini-card"><span class="mini-num" style="color:' + SUITS[card.suit].color + '">' + RANK_NUM[card.rank] + '</span>' + suitSVG(card.suit, 'suit') + '</div>';
}

function groupOf(card) {
  return card.arcana === 'major' ? 'major' : card.suit;
}

function orientationLabel(o) { return o === 'reversed' ? '逆位' : '正位'; }

// ===== 无头回归自检（仅当 URL 带 ?selftest 时运行）=====
function runSelfTest() {
  const results = [];
  const pass = function (name) { results.push('PASS ' + name); };
  const fail = function (name, msg) { results.push('FAIL ' + name + (msg ? ': ' + msg : '')); };

  // 1) 数据完整性
  try {
    if (TAROT_CARDS.length !== 78) fail('data-count', 'expected 78, got ' + TAROT_CARDS.length);
    else pass('data-count-78');

    const ids = new Set(); let dup = null;
    TAROT_CARDS.forEach(function (c) { if (ids.has(c.id)) dup = c.id; ids.add(c.id); });
    if (dup) fail('data-unique', dup); else pass('data-unique');

    const missing = [];
    TAROT_CARDS.forEach(function (c) {
      if (!c.name || !c.nameEn || !c.desc) missing.push(c.id);
      if (!c.upright || !c.upright.summary || !Array.isArray(c.upright.keywords) || !c.upright.keywords.length) missing.push(c.id + ':u');
      if (!c.reversed || !c.reversed.summary || !Array.isArray(c.reversed.keywords) || !c.reversed.keywords.length) missing.push(c.id + ':r');
    });
    if (missing.length) fail('data-fields', missing.join(','));
    else pass('data-fields');

    const badDims = [];
    TAROT_CARDS.forEach(function (c) {
      ['upright', 'reversed'].forEach(function (o) {
        const today = todayReadingFor(c, o);
        DIMENSIONS.forEach(function (d) {
          if (!today[d.key] || !String(today[d.key]).trim()) badDims.push(c.id + ':' + o + ':' + d.key);
        });
      });
    });
    if (badDims.length) fail('dims', badDims.slice(0, 5).join(','));
    else pass('dims-all-cards');
  } catch (e) { fail('data-exception', e.message); }

  // 2) 存储读写
  try {
    const orig = {
      notes: storeGet(STORE_KEYS.notes, {}),
      learned: storeGet(STORE_KEYS.learned, []),
      today: storeGet(STORE_KEYS.today, null)
    };
    const id = TAROT_CARDS[0].id;
    NotesStore.add(id, '自检备注');
    const arr = NotesStore.forCard(id);
    if (!arr.length || arr[0].text !== '自检备注') fail('notes-add'); else pass('notes-add');
    NotesStore.update(id, arr[0].ts, '已更新');
    if (NotesStore.forCard(id)[0].text !== '已更新') fail('notes-update'); else pass('notes-update');
    NotesStore.remove(id, arr[0].ts);
    if (NotesStore.forCard(id).length) fail('notes-remove'); else pass('notes-remove');

    const t0 = LearnedStore.toggle(id);
    const t1 = LearnedStore.toggle(id);
    if (t0 !== true || t1 !== false) fail('learned-toggle'); else pass('learned-toggle');

    TodayStore.set(id, 'reversed');
    const t = TodayStore.get();
    if (!t || t.cardId !== id || t.orientation !== 'reversed') fail('today-store'); else pass('today-store');
    TodayStore.clear();

    storeSet(STORE_KEYS.notes, orig.notes);
    storeSet(STORE_KEYS.learned, orig.learned);
    if (orig.today) storeSet(STORE_KEYS.today, orig.today); else localStorage.removeItem(STORE_KEYS.today);
  } catch (e) { fail('store-exception', e.message); }

  // 3) 页面渲染冒烟
  try {
    renderHome();
    if (!document.querySelector('#view-home .tarot-card')) fail('ui-home'); else pass('ui-home');

    TodayStore.set(TAROT_CARDS[0].id, 'upright');
    renderHome();
    const resultEl = document.getElementById('today-result');
    const hasResult = resultEl && resultEl.innerHTML.indexOf('orientation-badge upright') >= 0 && resultEl.innerHTML.indexOf(TAROT_CARDS[0].name) >= 0;
    if (!hasResult) fail('ui-today-result'); else pass('ui-today-result');
    TodayStore.clear();

    Router.go('glossary'); renderGlossary();
    const rowCount = document.querySelectorAll('#view-glossary .card-row').length;
    if (rowCount !== 78) fail('ui-glossary-count', 'expected 78, got ' + rowCount); else pass('ui-glossary-count');

    const sample = TAROT_CARDS[21];
    Router.go('detail'); renderDetail(sample.id);
    if (!document.getElementById('note-input') || !document.getElementById('learn-toggle')) fail('ui-detail'); else pass('ui-detail');

    Router.go('me'); renderMe();
    if (!document.getElementById('me-export') || !document.getElementById('me-import')) fail('ui-me'); else pass('ui-me');
  } catch (e) { fail('ui-exception', e.message); }

  const fails = results.filter(function (r) { return r.indexOf('FAIL') === 0; });
  const div = document.createElement('div');
  div.id = 'selftest';
  div.setAttribute('data-result', fails.length ? 'FAIL' : 'PASS');
  div.setAttribute('data-count', String(results.length));
  div.textContent = fails.length ? fails.join(' | ') : results.join(' | ');
  document.body.appendChild(div);
}

// ===== 启动 =====
function boot() {
  const tabbar = document.getElementById('tabbar');
  tabbar.innerHTML = tabbarHTML();
  tabbar.querySelectorAll('button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const view = btn.dataset.view;
      if (view === 'glossary') renderGlossary();
      else if (view === 'me') renderMe();
      else renderHome();
      Router.go(view);
    });
  });
  renderHome();
  Router.go('home');
  // 供 WebView 壳的系统返回键调用
  window.taOnBack = function () { Router.back(); };

  // 预览/截图钩子：?page=glossary | ?page=detail&card=m00 | ?page=me
  try {
    const params = new URLSearchParams(location.search);
    const page = params.get('page');
    const cardId = params.get('card');
    if (page === 'glossary') { renderGlossary(); Router.go('glossary'); }
    else if (page === 'detail' && cardId && getCard(cardId)) { renderDetail(cardId); Router.go('detail'); }
    else if (page === 'me') { renderMe(); Router.go('me'); }
    else if (page === 'today') {
      const t = TodayStore.isToday() ? TodayStore.get() : null;
      const card = t ? getCard(t.cardId) : randomCard();
      const orientation = t ? t.orientation : (Math.random() < 0.5 ? 'upright' : 'reversed');
      if (!t) TodayStore.set(card.id, orientation);
      renderHome();
      Router.go('home');
    }
  } catch (e) { console.warn('preview hook', e); }

  if (location.search.indexOf('selftest') >= 0) setTimeout(runSelfTest, 150);
  if (location.search.indexOf('qa') >= 0) setTimeout(runQA, 200);

function runQA() {
  const out = {
    innerWidth: window.innerWidth,
    scrollWidth: document.body.scrollWidth,
    hasOverflowX: document.body.scrollWidth > window.innerWidth,
    activeView: Router.current,
    tabbarButtons: document.querySelectorAll('#tabbar button').length,
    bodyBg: getComputedStyle(document.body).backgroundColor,
    appMaxWidth: getComputedStyle(document.getElementById('app')).maxWidth,
    cardCount: document.querySelectorAll('.tarot-card').length,
    cardRowCount: document.querySelectorAll('.card-row').length,
    dimItemCount: document.querySelectorAll('.dim-item').length,
    noteInput: !!document.getElementById('note-input'),
    cardBackBg: (function(){ var el=document.querySelector('.card-back'); return el ? getComputedStyle(el).backgroundImage.slice(0,40) : null; })(),
    badgeBg: (function(){ var el=document.querySelector('.orientation-badge'); return el ? getComputedStyle(el).backgroundColor : null; })(),
    firstDimLabel: (function(){ var el=document.querySelector('.dim-item .dim-head'); return el ? el.textContent.trim() : null; })(),
    firstRowName: (function(){ var el=document.querySelector('.card-row .row-name'); return el ? el.textContent : null; })(),
    learnLabel: (function(){ var el=document.getElementById('learn-label'); return el ? el.textContent : null; })(),
    noteLimitAttr: (function(){ var el=document.getElementById('note-input'); return el ? el.getAttribute('maxlength') : null; })(),
    drawCardRect: (function(){ var el=document.getElementById('today-card'); if(!el) return null; var r=el.getBoundingClientRect(); return Math.round(r.left)+','+Math.round(r.top)+','+Math.round(r.width)+'x'+Math.round(r.height); })()
  };
  const div = document.createElement('div');
  div.id = 'qa';
  div.textContent = JSON.stringify(out);
  document.body.appendChild(div);
}
}
document.addEventListener('DOMContentLoaded', boot);

</script>
